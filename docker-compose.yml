services:
  postgres:
    image: postgres:16
    container_name: ai_support_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_platform
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
